services:
  - type: web
    name: sar-sentinel-india-demo-api
    runtime: python
    plan: free
    branch: integrate/nisar-gcov
    rootDir: backend
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SAR_PUBLIC_READ_ONLY
        value: "true"
      - key: SAR_AUTO_ACQUISITION_ENABLED
        value: "false"
      - key: SAR_CORS_ORIGINS
        sync: false
